[package]
name = "greybags"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Windows ShellBags dissector and analysis toolkit"
readme = "README.md"
repository = "https://github.com/greysneakthief/greybags"
keywords = ["forensics", "dfir", "shellbags", "registry", "windows"]
categories = ["command-line-utilities", "parser-implementations"]
authors = ["greysneakthief"]

[lib]
name = "greybags"
path = "src/lib.rs"

[[bin]]
name = "greybags"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"
clap_mangen = "0.2"
csv = "1.3"
encoding_rs = "0.8"
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Debian/Ubuntu packaging via `cargo deb` (https://github.com/kornelski/cargo-deb).
[package.metadata.deb]
maintainer = "greysneakthief"
copyright = "greysneakthief"
section = "utils"
priority = "optional"
extended-description = """\
greybags parses Windows ShellBags (BagMRU/Bags) from offline NTUSER.DAT and \
UsrClass.dat hives, replays registry transaction logs, recovers deleted BagMRU \
keys from unallocated hive cells, dissects every shell item down to field \
offsets, and produces timelines and triage findings. Output formats include \
CSV, JSON, JSON Lines, Sleuth Kit bodyfile, and Markdown reports."""
depends = "$auto"
recommends = "sleuthkit"
suggests = "dotnet-runtime-8.0, ewf-tools, ntfs-3g"
assets = [
    ["target/release/greybags", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/greybags/README.md", "644"],
    ["docs/SHELLBAGS.md", "usr/share/doc/greybags/SHELLBAGS.md", "644"],
    ["contrib/watchlist.txt", "usr/share/greybags/watchlist.txt", "644"],
    ["scripts/install-sbecmd.sh", "usr/share/greybags/scripts/install-sbecmd.sh", "755"],
    ["scripts/collect-hives.sh", "usr/share/greybags/scripts/collect-hives.sh", "755"],
    ["target/assets/greybags.1.gz", "usr/share/man/man1/greybags.1.gz", "644"],
    ["target/assets/greybags.bash", "usr/share/bash-completion/completions/greybags", "644"],
    ["target/assets/_greybags", "usr/share/zsh/vendor-completions/_greybags", "644"],
    ["target/assets/greybags.fish", "usr/share/fish/vendor_completions.d/greybags.fish", "644"],
]
